# Environment overrides use LOCATION_PROVIDER, LOCATION_INPUTTIPS_ENDPOINT
# (or legacy LOCATION_ENDPOINT), LOCATION_API_KEY, LOCATION_TIMEOUT_SECONDS,
# and LOCATION_USER_AGENT.
provider: amap
amap_inputtips_endpoint: https://restapi.amap.com/v3/assistant/inputtips
amap_endpoint: https://restapi.amap.com/v3/assistant/inputtips
timeout_seconds: 5
cache_ttl_seconds: 600
cache_max_entries: 256
minimum_interval_seconds: 1
result_limit: 8
user_agent: ScenarioAgent/1.0 (local development)
