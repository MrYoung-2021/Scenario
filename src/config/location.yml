# Environment overrides use the LOCATION_PROVIDER, LOCATION_ENDPOINT,
# LOCATION_API_KEY, LOCATION_TIMEOUT_SECONDS, and LOCATION_USER_AGENT variables.
provider: nominatim
endpoint: https://nominatim.openstreetmap.org/search
amap_endpoint: https://restapi.amap.com/v3/geocode/geo
timeout_seconds: 5
cache_ttl_seconds: 600
cache_max_entries: 256
minimum_interval_seconds: 1
result_limit: 8
user_agent: ScenarioAgent/1.0 (local development)
