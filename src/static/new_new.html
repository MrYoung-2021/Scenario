<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>军事想定工作区</title>
  <link rel="stylesheet" href="/static/scenario.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><span>想定工作区</span></div>
    <nav class="top-tabs" aria-label="主导航">
      <button class="top-tab active" data-page="workspace">工作区</button>
      <button class="top-tab" data-page="knowledge">知识库管理</button>
    </nav>
    <div class="health" id="health-status"><span class="status-dot"></span>服务在线</div>
  </header>

  <main id="workspace-page" class="page workspace-page">
    <aside class="project-sidebar">
      <div class="sidebar-heading"><span>想定项目</span><button id="new-project" class="icon-button" title="新建项目" aria-label="新建项目">+</button></div>
      <div id="project-list" class="project-list"></div>
      <div id="project-empty" class="empty-sidebar">还没有项目<br><button id="empty-new-project" class="text-button">创建第一个项目</button></div>
    </aside>

    <section class="workspace-main">
      <div id="workspace-empty" class="workspace-empty">
        <div class="empty-symbol">+</div>
        <h1>创建一个军事想定</h1>
        <p>从背景、编成、任务到定稿，按步骤完成并随时恢复。</p>
        <button id="empty-create" class="primary-button">新建想定项目</button>
      </div>

      <div id="scenario-workspace" class="scenario-workspace hidden">
        <div class="workspace-header">
          <div><div class="eyebrow">当前想定</div><h1 id="scenario-title">未命名想定</h1></div>
          <button id="delete-current" class="danger-button">删除项目</button>
        </div>
        <div id="stepper" class="stepper" role="tablist" aria-label="想定步骤"></div>
        <div class="workspace-grid">
          <section class="step-panel">
            <div class="step-title-row"><div><div class="eyebrow" id="step-kicker">STEP 1</div><h2 id="step-title">背景与环境</h2></div><span id="step-status" class="state-badge">未保存</span></div>
            <div id="confirmed-context" class="confirmed-context hidden"></div>
            <form id="step-form" class="step-form"></form>
            <div class="form-actions"><button id="save-input" class="outline-button">保存输入</button><button id="generate-step" class="primary-button">生成草案</button></div>
            <section class="result-section">
              <div class="result-header"><h3>生成结果</h3><span id="result-version" class="muted"></span></div>
              <div id="result-progress" class="result-progress hidden" aria-live="polite"></div>
              <div id="result-sources" class="source-list"></div>
              <div id="result-output" class="result-output"><span class="muted">保存输入后可生成草案。</span></div>
              <div id="result-error" class="result-error hidden"></div>
              <div class="result-actions"><button id="revise-step" class="outline-button" disabled>按意见修改</button><button id="confirm-step" class="primary-button" disabled>确认并继续</button></div>
            </section>
          </section>
          <aside class="summary-panel"><div class="summary-heading"><span>已确认摘要</span><span class="muted">只读</span></div><div id="summary-content" class="summary-content"><span class="muted">确认步骤后显示摘要。</span></div></aside>
        </div>
      </div>
    </section>
  </main>

  <main id="knowledge-page" class="page knowledge-page hidden">
    <aside class="kb-sidebar"><div class="sidebar-heading"><span>知识集合</span></div><div id="kb-list" class="kb-list"></div></aside>
    <section class="knowledge-main"><div class="knowledge-toolbar"><div><div class="eyebrow">知识库管理</div><h1>可复用知识</h1></div><div class="toolbar-actions"><span id="kb-count" class="muted"></span><button id="add-knowledge" class="primary-button">新建知识</button><button id="refresh-kb" class="outline-button">刷新</button></div></div><div id="knowledge-list" class="knowledge-list"><div class="empty-state">选择左侧知识集合查看内容。</div></div></section>
  </main>

  <div id="project-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="project-modal-title"><div class="modal-card"><div class="modal-heading"><h2 id="project-modal-title">新建想定项目</h2><button class="icon-button modal-close" data-close-modal aria-label="关闭">×</button></div><label for="project-title">项目名称</label><input id="project-title" maxlength="200" placeholder="例如：山地通道防御想定"><div class="modal-actions"><button class="outline-button" data-close-modal>取消</button><button id="create-project" class="primary-button">创建项目</button></div></div></div>
  <div id="revision-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="revision-modal-title"><div class="modal-card"><div class="modal-heading"><h2 id="revision-modal-title">按意见修改</h2><button class="icon-button modal-close" data-close-modal aria-label="关闭">×</button></div><label for="revision-text">修改意见</label><textarea id="revision-text" maxlength="1000" rows="6" placeholder="只描述当前步骤需要调整的内容"></textarea><div class="modal-actions"><button class="outline-button" data-close-modal>取消</button><button id="submit-revision" class="primary-button">提交修改</button></div></div></div>
  <div id="knowledge-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="knowledge-modal-title"><div class="modal-card"><div class="modal-heading"><h2 id="knowledge-modal-title">新建知识</h2><button class="icon-button modal-close" data-close-modal aria-label="关闭">×</button></div><label for="knowledge-base-select">目标知识库</label><select id="knowledge-base-select"></select><label for="knowledge-content">知识内容</label><textarea id="knowledge-content" maxlength="5000" rows="8" placeholder="输入可复用的知识内容"></textarea><div class="modal-actions"><button class="outline-button" data-close-modal>取消</button><button id="submit-knowledge" class="primary-button">添加知识</button></div></div></div>
  <div id="delete-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title"><div class="modal-card"><div class="modal-heading"><h2 id="delete-modal-title">删除想定项目</h2><button class="icon-button modal-close" data-close-modal aria-label="关闭">×</button></div><p class="modal-copy">项目、步骤输入和已生成版本将一并删除，此操作不可撤销。</p><div class="modal-actions"><button class="outline-button" data-close-modal>取消</button><button id="confirm-delete" class="danger-button">确认删除</button></div></div></div>
  <div id="knowledge-delete-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="knowledge-delete-modal-title"><div class="modal-card"><div class="modal-heading"><h2 id="knowledge-delete-modal-title">删除知识条目</h2><button class="icon-button modal-close" data-close-modal aria-label="关闭">×</button></div><p class="modal-copy">该知识条目将从知识库中永久删除。</p><div class="modal-actions"><button class="outline-button" data-close-modal>取消</button><button id="confirm-knowledge-delete" class="danger-button">确认删除</button></div></div></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="/static/scenario.js?v=6" defer></script>
</body>
</html>
